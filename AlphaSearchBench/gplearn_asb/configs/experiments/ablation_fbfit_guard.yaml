# E2 — fb_fitness + IC floor 가드 (E1의 ablation_fbfit과 가드 유무만 차이)
# 근거: fbfit_42 승자의 train |IC| 0.006 — fb는 회전 패널티만 있고 신호 강도
# 하한이 없어 "IC 없는 저회전 Sharpe"를 허용한다 (nsguard 실측 발동률 59%와 동형).

market: csi800

search:
  start_date: "2010-01-01"
  end_date: "2019-12-31"

gp:
  population_size: 1000
  generations: 5
  hall_of_fame: 50
  n_components: 10
  fitness_metric: fb_fitness
  stopping_criteria: 1.0e9
  net_sharpe_min_abs_ic: 0.01     # ★ E2의 유일한 축 — |signed_train_IC| >= 0.01

constraint:
  mode: strict_penalty
  worst_fitness: -1.0e6

validity:
  min_mean_daily_coverage_ratio: 0.05
  min_median_daily_n_valid: 30
  min_valid_day_ratio: 0.90

backtest:
  transaction_cost_rate: 0.0015
  long_short_quantile: 0.2
